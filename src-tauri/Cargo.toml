[package]
name = "evpoly-desktop"
version = "2.4.3"
description = "EVPoly Desktop - Cross-platform trading bot manager"
authors = ["Degenapetrader"]
license = "SEE LICENSE"
repository = "https://github.com/Degenapetrader/EVPOLY"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
ethers-signers = "2.0"
zeroize = "1"
sysinfo = "0.30"
alloy-primitives = "1.0.27"
alloy-signer = "1.0.27"
alloy-signer-local = "1.0.27"
hmac = "0.12"
polymarket_client_sdk_v2 = { version = "=0.5.1", features = ["clob"] }
secrecy = "0.10"
sha2 = "0.10"
