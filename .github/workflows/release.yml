name: Release EVPoly Linux

on:
  push:
    tags:
      - "Linux-v*"
      - "Linux-hotfix-v*"

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight-linux-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fast gate checks
        run: INSTALL_DEPS=1 RUN_FRONTEND_BUILD=1 RUN_CARGO_CHECK=0 RUN_SMOKE=0 bash scripts/desktop-gate-fast.sh

  linux-deb:
    needs:
      - preflight-linux-fast
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Linux branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-system-deps.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build EVPOLY sidecar (Linux)
        run: bash scripts/build-sidecar-linux.sh

      - name: Install desktop dependencies
        run: npm ci

      - name: Desktop tests
        run: npm test

      - name: Runtime smoke checks
        run: bash scripts/smoke-release.sh

      - name: Build and publish Ubuntu deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles deb
          tagName: ${{ github.ref_name }}
          releaseName: "EVPoly Linux ${{ github.ref_name }}"
          releaseBody: "Ubuntu XFCE .deb installer for EVPoly Linux. Includes the EVPoly desktop app, bundled bot sidecar, and Remote Desktop support."
          releaseDraft: false
          prerelease: false

      - name: Ubuntu deb smoke
        run: bash scripts/smoke-installer-linux.sh

      - name: Install Ubuntu deb
        run: sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb

      - name: Verify installed Linux binaries
        run: |
          test -x /usr/bin/evpoly-desktop
          test -x /usr/bin/evpoly-bot
