name: Desktop Preflight

on:
  push:
    branches:
      - desktop
  pull_request:
    branches:
      - desktop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build EVPOLY sidecar (Linux)
        run: |
          git clone --depth 1 --branch main https://github.com/Degenapetrader/EVPOLY.git "$RUNNER_TEMP/evpoly-core"
          cargo build --release --manifest-path "$RUNNER_TEMP/evpoly-core/Cargo.toml" --bin polymarket-arbitrage-bot
          mkdir -p src-tauri/binaries
          cp "$RUNNER_TEMP/evpoly-core/target/release/polymarket-arbitrage-bot" "src-tauri/binaries/evpoly-bot-x86_64-unknown-linux-gnu"
          chmod +x "src-tauri/binaries/evpoly-bot-x86_64-unknown-linux-gnu"

      - name: Install desktop dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Runtime smoke checks
        run: bash scripts/smoke-release.sh

  preflight-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build EVPOLY sidecar (Windows)
        shell: pwsh
        run: |
          git clone --depth 1 --branch main https://github.com/Degenapetrader/EVPOLY.git "$env:RUNNER_TEMP\evpoly-core"
          cargo build --release --manifest-path "$env:RUNNER_TEMP\evpoly-core\Cargo.toml" --bin polymarket-arbitrage-bot
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\evpoly-core\target\release\polymarket-arbitrage-bot.exe" "src-tauri\binaries\evpoly-bot-x86_64-pc-windows-msvc.exe" -Force

      - name: Install desktop dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Backend check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Runtime smoke checks
        shell: pwsh
        run: ./scripts/smoke-release.ps1
