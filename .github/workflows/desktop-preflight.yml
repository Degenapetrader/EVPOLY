name: Desktop Preflight

on:
  push:
    branches:
      - desktop
  pull_request:
    branches:
      - desktop
  workflow_dispatch:
    inputs:
      full_smoke:
        description: "Run slower sidecar build + smoke on Linux"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-linux-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fast gate checks
        run: INSTALL_DEPS=1 RUN_FRONTEND_BUILD=1 RUN_CARGO_CHECK=0 RUN_SMOKE=0 bash scripts/desktop-gate-fast.sh

  preflight-windows-fast:
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fast gate checks
        shell: pwsh
        run: ./scripts/desktop-gate-fast.ps1 -InstallDeps -RunSmoke:$false -RunCargoCheck:$false

  preflight-linux-full-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_smoke == true }}
    needs:
      - preflight-linux-fast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build EVPOLY sidecar (Linux)
        run: bash scripts/build-sidecar-linux.sh

      - name: Runtime smoke checks
        run: bash scripts/smoke-release.sh
