[package]
name = "polymarket-arbitrage-bot"
version = "2.6.2"
edition = "2021"
license-file = "LICENSE"
default-run = "polymarket-arbitrage-bot"
autobins = false

[[bin]]
name = "polymarket-arbitrage-bot"
path = "src/main.rs"
test = false

[[bin]]
name = "test_predict_fun"
path = "src/bin/test_predict_fun.rs"
test = false

[[bin]]
name = "test_sell"
path = "src/bin/test_sell.rs"
test = false

[[bin]]
name = "test_redeem"
path = "src/bin/test_redeem.rs"
test = false

[[bin]]
name = "test_allowance"
path = "src/bin/test_allowance.rs"
test = false

[[bin]]
name = "test_limit_order"
path = "src/bin/test_limit_order.rs"
test = false

[[bin]]
name = "test_merge"
path = "src/bin/test_merge.rs"
test = false

[[bin]]
name = "test_relayer_key"
path = "src/bin/test_relayer_key.rs"
test = false

[[bin]]
name = "main_dual_limit_045"
path = "src/bin/main_dual_limit_045.rs"
test = false

[[bin]]
name = "polymarket-arbitrage-bot-limit"
path = "src/bin/main_limit.rs"
test = false

[[bin]]
name = "price_monitor"
path = "src/bin/main_price_monitor.rs"
test = false

[[bin]]
name = "manual_bot"
path = "src/bin/manual_bot.rs"
test = false

[[bin]]
name = "alpha_service"
path = "src/bin/alpha_service.rs"
test = false

[[bin]]
name = "builder_fees"
path = "src/bin/builder_fees.rs"
test = false

[[bin]]
name = "db_lock_audit"
path = "src/bin/db_lock_audit.rs"
test = false

[[bin]]
name = "manual_inventory_exit"
path = "src/bin/manual_inventory_exit.rs"
test = false

[[bin]]
name = "wrap_pusd"
path = "src/bin/wrap_pusd.rs"
test = false

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
hmac = "0.12"
sha2 = "0.10"
secrecy = "0.10"
hex = "0.4"
base64 = "0.21"
polymarket_client_sdk_v2 = { version = "=0.6.0-canary.1", features = ["clob", "ctf", "ws", "gamma", "bridge", "rtds"] }
alloy = { version = "1.3", features = ["full"] }
alloy-contract = "1.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
axum = { version = "0.8", features = ["json"] }

[patch.crates-io]
polymarket_client_sdk_v2 = { path = "vendor-polymarket-client-sdk/polymarket_client_sdk_v2" }
